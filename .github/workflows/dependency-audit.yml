name: Dependency Audit

# Weekly freshness + security advisory report. Non-blocking by design — it
# produces a report for the weekly review ritual (see docs/CI_RUNBOOK.md), it
# does NOT gate merges. Escalate per the criteria in the runbook.

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  outdated:
    name: Outdated packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Report outdated dependencies
        run: |
          {
            echo '## Outdated packages';
            echo '```';
            flutter pub outdated || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security advisories (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pin the verified v2.7.0 scanner action. The removed root @v1 tag
      # failed during job setup, before continue-on-error could take effect.
      - name: OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --lockfile=pubspec.lock
